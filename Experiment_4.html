<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Room Booking Form</title>
</head>
<body>
 <center>
    <fieldset> 
    <form>
        <h1>Hotel Room Booking Form</h1>
        <label for="full name">Full Name:</label>
        <input type="Text" id="login" name="login" required>
        <br><br>
        <label for="Email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br>
        <br>
        <label for="Phone">Phone:</label>
        <input type="number" id="number" name="number" required>
        <br><br>
        <label for="Check-in date" name="in date">Check-in Date:</label>
        <input type="date" id="in-date" name="in-date"
        placeholder="dd-mm-yyyy" required>
        <br><br>
        <label for="Check-out date" name="out date">Check-out Date:</label>
        <input type="date" id="out-date" name="out-date"
        placeholder="dd-mm-yyyy" required>
        <br><br>
        <label for="pickup" name="pickup">Free Pickup:</label>
        <br><br>
        <input type="radio" id="pickup" name="pickup">
        <label for="pickup" name="pickup">Yes Please! - Pick me up on arrival</label>
        <br>
        <input type="radio" id="pickup" name="pickup">
        <label for="pickup" name="pickup">No Thanks - I'll make my own way there</label>
        <br><br>
        <label for="room">Room Type:</label>
        <select>
            <option>--None--</option>
            <option>Single Room</option>
            <option>Double Room</option>
            <option>Deluxe room</option>
            <option>Small Suite</option>
            <option>Presidential Suite</option>
            <option>Family Room</option>
        </select>
        <br>
        <br>
        <label for="guests">Number of Guests:</label>
        <input type="text" id="guests" name="guests" required>
        <br>
        <br>
        <label for="reuests">Special Requests:</label>
        <br>
        <textarea rows="10" cols="80"  id="reuests" name="requests"></textarea>
        <br>
        <br>
        <button>Book Now</button>
        <button>Reset Form</Form></button>
    </form>
    </fieldset> 
 </center>
    
</body>
</html>
