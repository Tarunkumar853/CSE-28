<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            width: 100vw;
            height: 100vh;
            background-color: bisque;
            border: 5px solid black;
        }
        .box{
            margin: 10px;
            width: 350px;
            height: 80px;
            background-color: blue;
            border-radius: 10px;
            position: relative;
            border: 3px solid red;
            /* animation-name: rightmovement;
            animation-duration: 5s;
            animation-iteration-count: 1;
            /* animation-delay: 2s; */
            /* animation-timing-function: cubic-bezier(1,-0.4,1,1); */ 
            /* animation-direction: alternate-reverse; */
            /* animation-fill-mode: both; */
            animation: 5s linear 1s infinite alternate none running rightmovement;
        }

        @keyframes rightmovement {
            from {
                top: 0;
                left: 0;
            }
            to {
                top: 0;
                left: 1350px;
            }
        }
        .box2{
            margin: 10px;
            width: 350px;
            height: 80px;
            background-color: blue;
            border-radius: 10px;
            position: relative;
            border: 3px solid red;
            animation: 5s ease-in 1s infinite alternate none running leftmovement;
        }
        @keyframes leftmovement{
            from{
                top: 800px;
                left: 1350px;
            }
            to{
                top: 800px;
                left: 0;
            }
        }
        #circle{
            margin: 10px;
            width: 50px;
            height: 50px;
            background-color: blue;
            border-radius: 100px;
            position: relative;
            border: 3px solid red;
            animation: 10s ease-in-out 0s infinite alternate-reverse none running circle;
            top: 250px;
            left: 750px;
        }
        @keyframes circle{
            0%{
                top: 0%;
                left: 5%;
            }
            30%{
                top: 35%;
                left: 90%;
            }
            60%{
                top: 45%;
                left: 10%;
            }
            90%{
                top: 68%;
                left: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
        <div class="box2"></div>
        <div id="circle"></div>
    </div>
</body>
</html>
