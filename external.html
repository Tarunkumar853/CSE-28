<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            justify-content: center;      
            align-items: center;         
            height: 100vh;
        }

        .profile-card {
            display: flex;
            flex-direction: column;       
            align-items: center;          
            justify-content: center;
            background: white;
            width: 350px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
        }

        .college-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            color: red;
        }

        .profile-card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 10px;
        }

        .student-name {
            font-size: 18px;
            font-weight: bold;
        }

        .branch {
            font-size: 14px;
            color: gray;
            margin-bottom: 10px;
        }

        hr {
            width: 100%;
            margin: 10px 0;
        }

        .details {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 14px;
        }

        .details div {
            display: flex;
            justify-content: space-between; 
        }
    </style>
</head>

<body>

<div class="container">
    <div class="profile-card">

        <div class="college-name">ABES Engineering College</div>

        <img src="https://m.media-amazon.com/images/I/41ONa5HOwfL._AC_UF1000,1000_QL80_.jpg" alt="Student Photo">

        <div class="student-name">Tarun Kumar</div>
        <div class="branch">B.TECH(CSE)</div>

        <hr>

        <div class="details">
            <div><span>Admission No:</span> <span>2025B01010853</span></div>
            <div><span>DOB:</span> <span>06-09-2008</span></div>
            <div><span>Blood Group:</span> <span>O+</span></div>
            <div><span>Hostel:</span> <span>No</span></div>
            <div><span>Valid Till:</span> <span>31.07.2029</span></div>
        </div>

    </div>
</div>

</body>
</html>
