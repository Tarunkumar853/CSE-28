<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
</head>
<style>
    body{
        margin: 5px;
        padding: 5px;
    } 
     html *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    div{
        width: 400px;
        height: 500px;
        background-color: #ccc;
        margin: 10px 20px;
        padding: 20px 40px;
        border: 5px dashed #999;
    }
    p{
        background-color: #f04;
        padding: 20px;
        border: 10px solid #444;
        margin: -20px;
    }
</style>
<body>
    <div>
        <p>
            Lorem, ipsum dolor sit amet consectetur adipisicing elit. Autem sapiente nobis beatae non impedit reprehenderit ducimus a officia nam et, aut corrupti ad blanditiis quos est vitae quisquam accusamus quaerat.
            lorem1000
        </p>
    </div>
        
    
</body>
</html>
