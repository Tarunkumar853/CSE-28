<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <form>
        <h1 style="text-align: center;">Student Registration Form</h1>
        <hr>
        <label for="Fname">Full Name:</label>
        <input type="text" id="Fname" name="Fname" placeholder="Enter your full name">
        <br>
        <br>
        <label for="Email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter valid email address" required>
        <br>
        <br>
        <label for="pswrd">Password:</label>
        <input type="password" id="pswrd" name="pswrd" placeholder="Enter password" required>
        <br>
        <br>
        <label for="Gender">Gender:</label>
        <input type="radio" id="Male" name="Gender">
        <label for="Male">Male</label>
        <input type="radio" id="female" name="Gender">
        <label for="Female">Female</label>
        <input type="radio" id="other" name="Gender">
        <label for="other">Other</label>
        <br><br>
        <label for="course">Course:</label>
        <select>
            <option>--Select Course --</option>
            <option>B.Tech</option>
            <option>BCA</option>
            <option>MCA</option>
            <option>M.Tech</option>
            <option>MBA</option>
            <option>BBA</option>
            <option>LLB.</option>
            <option>B.Sc</option>
            <option>B.Com</option>
            <optio>B.A</optio>
        </select>
        <br><br>
        <label for="Contact">Contact No:</label>
        <input type="number" id="contact" name="contact" placeholder="Enter phone number">
        <br><br>
        <label for="address">Address:</label>
        <br>
        <textarea id="address" name="address" placeholder="Enter your address"></textarea>
        <br><br>
        <button type="submit">Register</button>
        <button type="reset">Clear</button>
        <hr>
        <footer>
            <p style="text-align: center">&copy; 2025 Student Registration Portal</p>
        </footer>
        


    </form>
    
</body>
</html>
