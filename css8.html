    <title>Document</title>
    <style>

        .container{
            background-color: aquamarine;
            border: 3px solid black;
            display: flex;
            flex-direction: row;
            width: 400px;
        }
        #box1{
            background-color: yellow;
            border: 1px solid brown;
            margin: 3px;
            padding: 2px;
            width: 47%;
        }

        img{
             height: 170px;

        }
        @media (max-width:640px){
            .container{
                flex-direction: column;
            }
        }
    </style>
</head>
