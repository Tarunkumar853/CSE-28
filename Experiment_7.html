<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <style>
        *{
            margin: 0px;
            padding: 0;
            box-sizing: border-box;
        }
        .navbar {
            background-color: black;
            padding: 20px;
        }
        .navbar ul{
            list-style-type: none;
        }
        ul {
            display: flex;
            margin: 0;
            padding: 0;
            border-right: 1px bold white;
            align-items: center;
            justify-content: center;
        }
        .navbar ul a{
            color: white;
            text-decoration: none;
            padding: 12px;
            font-size: large;
        }
        .navbar ul a:hover{
            color: goldenrod;
            border-bottom: 1px bold goldenrod;
        }
        body {
            background-image: url(https://img.freepik.com/free-vector/modern-abstract-dark-violate-pink-background_84443-2784.jpg?semt=ais_hybrid&w=740&q=80);
            background-size: cover;
        }
    </style>
</head>
<body>
    <div class="navbar">
     <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Admission</a></li>
            <li><a href="#">Academics</a></li>
            <li><a href="#">Clubs</a></li>
            <li><a href="#">Campus</a></li>
            <li><a href="#">Placement</a></li>
            <li><a href="#">Research</a></li>
            <li><a href="#">Admission</a></li>
        </ul>
     </nav>
    </div>  
</body>
</html>
