<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive E-Commerce</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .navbar {
        width: 100%;
        background: #0d6efd;
        padding: 12px 25px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: white;
    }

    .logo {
        font-size: 1.6rem;
        font-weight: bold;
    }

    .nav-links {
        list-style: none;
        display: flex;
        gap: 25px;
    }

    .nav-links li a {
        text-decoration: none;
        color: white;
        font-size: 1rem;
        font-weight: 500;
    }

    .nav-links li a:hover {
        color: #ffdd57;
    }

    .right-section {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .search {
        padding: 6px 10px;
        border: none;
        border-radius: 4px;
    }

    .cart {
        font-size: 1.5rem;
        cursor: pointer;
    }

    .menu-icon {
        font-size: 1.8rem;
        cursor: pointer;
        display: none;
    }
   </style>
</head>
<body>

    <nav class="navbar">

        <div class="logo">ShopEase</div>

        <div class="menu-icon" id="menu-icon">
            ☰
        </div>

        <ul class="nav-links" id="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">Deals</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

        <div class="right-section">
            <input type="text" class="search" placeholder="Search products...">
            <div class="cart">🛒</div>
        </div>

    </nav>

</body>
</html>
